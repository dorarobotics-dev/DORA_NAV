# Extrinsic calibration of the simulated mobile robot. Each entry is the pose
# of `child` in `parent`, for mounted frames only (frames.yaml `kind`).
#
# Values measured from the model the sim actually loads: the one
# examples/contract-core/make_model.sh generates from the URDF with
# modules/simulation/mujoco_mickrobot/scripts/urdf_converter.py
# (models/mickrobot_3d.urdf + mujoco_extensions.xml). The tracked
# models/mickrobot.xml is not used (absolute paths, different geometry).
#   base_link   base_footprint is the ground projection (z = 0 in odom). In the
#               generated model base_link coincides with the free body, which
#               rests 0.0896 m above the ground plane: base_footprint z read
#               from MjData.xpos after mj_step settles it at rest (0.08963 at
#               5, 10 and 20 s, timestep 0.002, identity orientation).
#   rslidar     mickrobot_3d.urdf:207-210 lidar_joint origin xyz="0 -0.020 0.40",
#               no rpy, so identity (the continuous joint spins about z and is
#               held by damping; the lidar site has identity orientation).
#   camera      mujoco_extensions.xml:10-12  camera_link pos="0.40 0 0.35", and
#               xyaxes="0 -1 0 0 0 1". MuJoCo cameras look along -z; frames.yaml's
#               optical frame looks along +z with y down, so the optical axes in
#               base_link are x=(0,-1,0), y=(0,0,-1), z=(1,0,0), which is the
#               quaternion (-0.5, 0.5, -0.5, 0.5) in x, y, z, w.
#   imu_link    mujoco_extensions.xml:14     pos="0 0 0.25", identity
#
# Every edge is written out, including the identity rotations: a missing edge
# is an error, never an assumed zero.
contract_version: 1.0.0
robot: mickrobot-sim
calibrated: "2026-11-02"
source: >-
  DORA_NAV modules/simulation/mujoco_mickrobot/models/mickrobot_3d.urdf and
  mujoco_extensions.xml via examples/contract-core/make_model.sh
  (model values, not a physical calibration)
transforms:
  - parent: base_link
    child: rslidar
    translation_m: [0.0, -0.02, 0.4]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
  - parent: base_link
    child: camera_front
    translation_m: [0.40, 0.0, 0.35]
    rotation_xyzw: [-0.5, 0.5, -0.5, 0.5]
  - parent: base_link
    child: imu_link
    translation_m: [0.0, 0.0, 0.25]
    rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
